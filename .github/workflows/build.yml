name: Build Custom YouTube Music IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct URL to a decrypted YouTube Music IPA
        required: false
        default: https://site--linkfilesbot--c9wr46mbxrhc.code.run/download/6912261444/2163101
        type: string
      display_name:
        description: App display name
        required: false
        default: YouTube Music
        type: string
      bundle_id:
        description: Bundle identifier
        required: false
        default: com.google.ios.youtubemusic
        type: string
      enable_rymd:
        description: Build and inject Return-YouTube-Music-Dislikes
        required: false
        default: true
        type: boolean
      enable_ytmabc:
        description: Build and inject YTMABConfig
        required: false
        default: true
        type: boolean
      enable_youmusicpip:
        description: Build and inject YouMusicPiP
        required: false
        default: false
        type: boolean
      enable_volumeboostyt:
        description: Build and inject VolumeBoostYT
        required: false
        default: true
        type: boolean
      enable_openinapp:
        description: Add the Open in YouTube Music Safari extension
        required: false
        default: false
        type: boolean
      openinapp_deb_url:
        description: Optional direct URL to an OpenInApp deb; blank uses the built-in Safari extension
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Build MaxMusic IPA
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IPA_URL: ${{ inputs.ipa_url }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      BUNDLE_ID: ${{ inputs.bundle_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install make ldid libplist dpkg

      - name: Add GNU make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        with:
          path: theos/
          key: theos_cache_9bc7340

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv ./*.sdk "$THEOS/sdks"

      - name: Validate base IPA URL
        run: |
          curl -fL --retry 5 --retry-delay 2 -r 0-1023 -o sample.part "$IPA_URL"
          file_type="$(file --mime-type -b sample.part)"
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: the URL did not return an IPA. Detected type: $file_type"
            exit 1
          fi

      - name: Download base IPA
        run: |
          curl -fL --retry 5 --retry-delay 2 -o ytm.ipa "$IPA_URL"
          unzip -tq ytm.ipa > /dev/null
          unzip -p ytm.ipa Payload/YouTubeMusic.app/Info.plist > ytm-info.plist
          YTM_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ytm-info.plist)"
          TWEAK_VERSION="$(sed -n 's/^PACKAGE_VERSION[[:space:]]*=[[:space:]]*//p' Makefile | head -1)"
          echo "YTM_VERSION=$YTM_VERSION" >> "$GITHUB_ENV"
          echo "TWEAK_VERSION=$TWEAK_VERSION" >> "$GITHUB_ENV"
          echo "OUTPUT_NAME=MaxMusic_${TWEAK_VERSION}_$YTM_VERSION" >> "$GITHUB_ENV"
          if ! unzip -l ytm.ipa | grep -q 'Payload/YouTubeMusic.app/PlugIns/.*\.appex/Info.plist'; then
            echo "::error::The base IPA does not contain app extensions."
            exit 1
          fi

      - name: Bundle tweak resources
        run: |
          rm -rf ytm-base
          mkdir ytm-base
          unzip -q ytm.ipa -d ytm-base
          cp -R "layout/Library/Application Support/YTMusicUltimate.bundle" "ytm-base/Payload/YouTubeMusic.app/YTMusicUltimate.bundle"
          test -f "ytm-base/Payload/YouTubeMusic.app/YTMusicUltimate.bundle/Info.plist"
          rm ytm.ipa
          (cd ytm-base && zip -qry -X ../ytm.ipa .)
          rm -rf ytm-base

      - name: Clone headers
        run: |
          for repo in YouTubeHeader PSHeader YouTubeMusicHeader; do
            if [ -d "$THEOS/include/$repo" ]; then
              git -C "$THEOS/include/$repo" pull --ff-only
            else
              git clone --quiet --depth=1 "https://github.com/PoomSmart/$repo.git" "$THEOS/include/$repo"
            fi
          done

      - name: Clone Return-YouTube-Dislikes
        if: ${{ inputs.enable_rymd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone Return-YouTube-Music-Dislikes
        if: ${{ inputs.enable_rymd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Music-Dislikes.git

      - name: Clone YTMABConfig
        if: ${{ inputs.enable_ytmabc }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTMABConfig.git

      - name: Clone YouPiP
        if: ${{ inputs.enable_youmusicpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git

      - name: Clone YouMusicPiP
        if: ${{ inputs.enable_youmusicpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouMusicPiP.git

      - name: Clone VolumeBoostYT
        if: ${{ inputs.enable_volumeboostyt }}
        run: git clone --quiet --depth=1 https://github.com/VasirakCalgux/VolumeBoostYT.git

      - name: Build Return-YouTube-Music-Dislikes
        if: ${{ inputs.enable_rymd }}
        run: |
          cd Return-YouTube-Music-Dislikes
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../rymd.deb

      - name: Build YTMABConfig
        if: ${{ inputs.enable_ytmabc }}
        run: |
          cd YTMABConfig
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../ytmabc.deb

      - name: Build YouMusicPiP
        if: ${{ inputs.enable_youmusicpip }}
        run: |
          cd YouMusicPiP
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ../youmusicpip.deb

      - name: Build VolumeBoostYT
        if: ${{ inputs.enable_volumeboostyt }}
        run: |
          cd VolumeBoostYT
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ../volumeboostyt.deb

      - name: Build MaxMusic tweak
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOADING=1
          mv packages/*.deb ytmult.deb

      - name: Make tweak find its bundled CydiaSubstrate
        run: |
          rm -rf "$RUNNER_TEMP/ytmult-deb"
          mkdir -p "$RUNNER_TEMP/ytmult-deb"
          dpkg-deb -R ytmult.deb "$RUNNER_TEMP/ytmult-deb"
          DYLIB="$(find "$RUNNER_TEMP/ytmult-deb" -name 'YTMusicUltimate.dylib' -print -quit)"
          test -n "$DYLIB"
          if ! otool -l "$DYLIB" | grep -A2 LC_RPATH | grep -qE 'path @loader_path \(offset [0-9]+\)'; then
            install_name_tool -add_rpath @loader_path "$DYLIB"
          fi
          if ! otool -l "$DYLIB" | grep -A2 LC_RPATH | grep -qE 'path @loader_path \(offset [0-9]+\)'; then
            echo "::error::Failed to add @loader_path rpath to YTMusicUltimate.dylib"
            exit 1
          fi
          ldid -S "$DYLIB"
          rm ytmult.deb
          dpkg-deb -b "$RUNNER_TEMP/ytmult-deb" ytmult.deb

      - name: Fetch OpenInApp
        if: ${{ inputs.enable_openinapp }}
        env:
          OPENINAPP_DEB_URL: ${{ inputs.openinapp_deb_url }}
        run: |
          mkdir -p tweaks
          rm -rf tweaks/OpenInApp.deb tweaks/OpenInApp.deb.tmp tweaks/OpenInApp.appex
          if [ -n "$OPENINAPP_DEB_URL" ]; then
            curl -fL --retry 3 --retry-delay 2 -o tweaks/OpenInApp.deb.tmp "$OPENINAPP_DEB_URL"
            test -s tweaks/OpenInApp.deb.tmp
            mv tweaks/OpenInApp.deb.tmp tweaks/OpenInApp.deb
          else
            git clone --quiet --depth=1 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git "$RUNNER_TEMP/OpenInAppSource"
            cp -R "$RUNNER_TEMP/OpenInAppSource/OpenYouTubeSafariExtension.appex" "tweaks/OpenInApp.appex"
            APPEX="$PWD/tweaks/OpenInApp.appex"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Open in YouTube Music" "$APPEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName OpenInApp" "$APPEX/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.google.ios.youtubemusic.OpenInApp.Extension" "$APPEX/Info.plist"
            python3 - "$APPEX" <<'PY'
          import json, pathlib, sys

          appex = pathlib.Path(sys.argv[1])
          manifest = appex / "manifest.json"
          data = json.loads(manifest.read_text())
          data["name"] = "Open in YouTube Music"
          data["description"] = "Opens music.youtube.com links in the YouTube Music app"
          data["content_scripts"][0]["matches"] = ["*://music.youtube.com/*"]
          manifest.write_text(json.dumps(data, indent=2))

          (appex / "content.js").write_text("""(function () {
            const scheme = "vnd.youtube.music://";
            function openInApp() {
              if (!/(^|\.)music\.youtube\.com$/.test(location.hostname)) return;
              const parts = location.pathname.split("/").filter(Boolean);
              if (parts[0] === "watch") {
                const id = new URLSearchParams(location.search).get("v");
                if (id) location.href = scheme + "watch?v=" + encodeURIComponent(id);
              } else if (parts[0] === "playlist") {
                const id = new URLSearchParams(location.search).get("list");
                if (id) location.href = scheme + "playlist?list=" + encodeURIComponent(id);
              } else if (parts.length) {
                location.href = scheme + parts.slice(0, 2).join("/") + location.search;
              }
            }
            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", openInApp, { once: true });
            } else {
              openInApp();
            }
          })();
          """)
          PY
          fi

      - name: Download Azule
        run: |
          git clone --quiet --depth=1 https://github.com/mpelteshki/Azule.git "$RUNNER_TEMP/Azule"
          chmod +x "$RUNNER_TEMP/Azule/azule" "$RUNNER_TEMP"/Azule/bin/darwin/*

      - name: Inject tweaks with Azule
        run: |
          mkdir -p output
          files=("$PWD/ytmult.deb")
          if [ -s "$PWD/tweaks/OpenInApp.deb" ]; then
            files+=("$PWD/tweaks/OpenInApp.deb")
          fi
          if [ -d "$PWD/tweaks/OpenInApp.appex" ]; then
            files+=("$PWD/tweaks/OpenInApp.appex")
          fi
          if [ "${{ inputs.enable_openinapp }}" = "true" ] && [ "${#files[@]}" -eq 1 ]; then
            echo "::error::OpenInApp was enabled but no injectable source was prepared."
            exit 1
          fi
          "$RUNNER_TEMP/Azule/azule" -UuS -v -p "$DISPLAY_NAME" -b "$BUNDLE_ID" -i "$PWD/ytm.ipa" -n "$OUTPUT_NAME" -o "$PWD/output" -f "${files[@]}"

      - name: Verify IPA
        run: |
          OUT="output/${OUTPUT_NAME}.ipa"
          test -s "$OUT"
          unzip -tq "$OUT" > /dev/null
          unzip -l "$OUT" | grep -q 'Payload/YouTubeMusic.app/PlugIns/.*\.appex/Info.plist'
          unzip -l "$OUT" | grep -q 'Payload/YouTubeMusic.app/Frameworks/.*\.dylib'
          unzip -l "$OUT" | grep -q 'Payload/YouTubeMusic.app/YTMusicUltimate.bundle/Info.plist'
          unzip -l "$OUT" | grep -q 'Payload/YouTubeMusic.app/Frameworks/CydiaSubstrate.framework/CydiaSubstrate'
          unzip -p "$OUT" Payload/YouTubeMusic.app/Frameworks/YTMusicUltimate.dylib > output-tweak.dylib
          if ! otool -l output-tweak.dylib | grep -A2 LC_RPATH | grep -qE 'path @loader_path \(offset [0-9]+\)'; then
            echo "::error::YTMusicUltimate.dylib is missing the @loader_path rpath."
            exit 1
          fi
          unzip -p "$OUT" Payload/YouTubeMusic.app/Info.plist > output-info.plist
          if /usr/libexec/PlistBuddy -c 'Print :UISupportedDevices' output-info.plist > /dev/null 2>&1; then
            echo "::error::UISupportedDevices is still present in the output IPA."
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.OUTPUT_NAME }}_(${{ github.run_number }})
          name: MaxMusic ${{ env.TWEAK_VERSION }} and ${{ env.YTM_VERSION }}
          files: output/*.ipa
          draft: false
          generate_release_notes: true
