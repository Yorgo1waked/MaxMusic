name: Build Custom YouTube Music IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          # Install ldid via npm safely without failing
          npm install -g ldid || true
          
          # Download ipatool directly from GitHub releases to avoid Homebrew brew update bottlenecks
          IPATOOL_VERSION=$(curl -s "https://api.github.com/repos/majd/ipatool/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -L -o ipatool.tar.gz "https://github.com/majd/ipatool/releases/download/v${IPATOOL_VERSION}/ipatool_${IPATOOL_VERSION}_macOS_arm64.tar.gz" || \
          curl -L -o ipatool.tar.gz "https://github.com/majd/ipatool/releases/download/v${IPATOOL_VERSION}/ipatool_${IPATOOL_VERSION}_macOS_x86_64.tar.gz"
          tar -zxvf ipatool.tar.gz ipatool
          sudo mv ipatool /usr/local/bin/

      - name: Download Azule
        run: |
          git clone https://github.com/maccan/Azule.git ~/Azule
          sudo ln -sf ~/Azule/azule /usr/local/bin/azule

      - name: Fetch Tweaks
        run: |
          mkdir -p tweaks
          # Download OpenInApp tweak
          curl -L -o tweaks/OpenInApp.deb https://github.com/PoomSmart/OpenInApp/releases/latest/download/com.poomsmart.openinapp_deb.deb || true

      - name: Process and Inject IPA
        run: |
          # Ensure your decrypted base YouTube Music IPA is in your repo root or fetched here
          # azule -i base_ytm.ipag -o output/ -f tweaks/*.deb -v -u -s
          echo "Workflow reached injection phase successfully."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modded-ytm
          path: output/*.ipag
